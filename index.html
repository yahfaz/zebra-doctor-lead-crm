<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>Lead CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Archivo:wght@800;900&family=Figtree:wght@400;500;600;700&family=Caveat:wght@600&display=swap">
<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F5F7F6; --ink:#111816; --ink-2:#38443F; --muted:#69766F; --line:#E4E8E6; --line-2:#EEF1EF;
  --accent:#0E7C66; --accent-deep:#0A6253; --accent-tint:#EAF6F2; --on-accent:#FFFFFF;
  --good:#17803D; --good-tint:#E8F5EC; --warn:#9A5B00; --warn-tint:#FFF6E0; --bad:#B42318; --bad-tint:#FDEEEC; --hot:#C2410C; --hot-tint:#FFF0E6; --info:#2557A7; --info-tint:#EDF2FB;
  --shadow:none; --r:12px; --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-deep)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;font-size:15px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:700}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav-btn:hover{background:var(--panel-2)}
.nav-btn[aria-current="page"]{background:var(--accent-tint);color:var(--accent-deep);font-weight:600}
.nav-count{font-size:11.5px;background:var(--panel-2);border-radius:999px;padding:1px 7px;color:var(--muted)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 20px;flex-wrap:wrap}
.top input[type=search]{flex:1;min-width:180px;max-width:420px}
.clock{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px}
.clock b{color:var(--ink);font-weight:600}
.content{padding:20px;max-width:1280px;width:100%}
h1{font-size:22px;line-height:1.2;margin:0}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.kpi{padding:14px 16px}
.kpi .n{font-size:26px;font-weight:700;line-height:1.1;margin-top:4px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-deep)}
.btn.danger{color:var(--bad);border-color:var(--bad-tint)}
.btn.sm{min-height:28px;padding:0 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=search],input[type=url],select,textarea{width:100%;min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.hint{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
.tbl-wrap{overflow-x:auto}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.b-good{background:var(--good-tint);color:var(--good)}
.b-warn{background:var(--warn-tint);color:var(--warn)}
.b-bad{background:var(--bad-tint);color:var(--bad)}
.b-hot{background:var(--hot-tint);color:var(--hot)}
.b-info{background:var(--info-tint);color:var(--info)}
.b-accent{background:var(--accent-tint);color:var(--accent-deep)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.timeline .t{font-size:12px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100;overflow:auto}
.modal{background:var(--panel);border-radius:14px;width:min(640px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.45);border:1px solid var(--line)}
.modal.wide{width:min(960px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line-2)}
.toast-wrap{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:380px;font-size:13px}
.toast.bad{background:var(--bad);color:#fff}
.bar{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;background:var(--accent)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.consent{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:32px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-tint);color:var(--warn);font-size:13px;margin-bottom:14px}
.banner.info{background:var(--info-tint);color:var(--info)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.steps .num{width:22px;height:22px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0}
.builder{display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px;align-items:start}
.block-card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.lp{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.hp{position:absolute;left:-9999px}
.check-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.mob-nav{display:none}

.side{background:#FFFFFF}
.top{background:rgba(255,255,255,.96);backdrop-filter:blur(8px)}
.card{box-shadow:none}
.card:hover{border-color:var(--line)}
.kpi{border-radius:12px}
.kpi .n{font-size:28px;letter-spacing:-.02em}
.nav-btn{font-size:14px;padding:9px 10px}
.btn{background:#FFFFFF}
.btn.ghost{background:none}
.content{max-width:1320px}
/* builder */
fieldset{min-width:0}
.builder>*{min-width:0}
.builder fieldset{grid-template-columns:minmax(0,1fr)}
.block-card{min-width:0}
.block-sum{flex:1 1 0;width:0}
.block-card{padding:0;gap:0;border-radius:12px}
.block-card.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.block-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;cursor:pointer;min-width:0}
.block-head b{white-space:nowrap}
.block-sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block-n{width:22px;height:22px;border-radius:6px;background:var(--panel-2);display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0}
.block-body{padding:4px 12px 14px;display:grid;gap:10px;border-top:1px solid var(--line-2)}
.list-ed{display:grid;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:var(--panel-2)}
.list-item{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#FFFFFF}
.img-pick{display:flex;gap:10px;align-items:flex-start}
.img-pick img,.img-empty{width:84px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:11px;color:var(--muted);background:var(--panel-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#FFFFFF;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#FFFFFF}
.preview-frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel-2)}
.preview-frame.mobile{max-width:390px;margin:0 auto}
.preview-frame .lp{border:0;border-radius:0}
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:#FFFFFF;cursor:pointer}
.tpl:hover{border-color:var(--accent)}
.tpl-sw{height:56px;border-radius:8px;display:block}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.col-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;padding:2px 4px}
.lead-card{background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:grab;display:grid;gap:4px}
.lead-card:active{cursor:grabbing}
/* ── landing-page kit (matches the live sales page) ── */
.lp{container-type:inline-size;font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.55;color:#0B1220}
.lp .dr-h{font-family:'Archivo',Impact,sans-serif;font-weight:900;letter-spacing:-.02em;line-height:1.06;text-wrap:balance}
.dr-bar{background:var(--c,#E3372A);color:#fff;text-align:center;font-weight:700;font-size:14px;padding:9px 14px}
.dr-bar b{background:#fff;color:var(--c,#E3372A);padding:1px 8px;border-radius:5px;margin:0 6px}
.dr-hero{position:relative;color:#fff;text-align:center;padding:36px 20px 46px;background-color:#0A1530;background-size:cover;background-position:center 58%;isolation:isolate;overflow:hidden}
.dr-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(760px 400px at 50% -4%,rgba(255,216,77,.2),transparent 62%),linear-gradient(180deg,rgba(10,21,48,var(--o1,.5)) 0%,rgba(10,21,48,var(--o2,.85)) 55%,#0A1530 100%)}
.dr-lock{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.dr-lock img{width:54px;height:54px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.dr-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 13px 6px 9px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-size:13.5px;font-weight:600}
.dr-pre{display:inline-block;background:#FFD84D;color:#0A1530;font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:7px;transform:rotate(-1deg)}
.dr-pre.r{transform:rotate(1deg)}
.dr-hero h1{font-size:clamp(30px,6cqi,62px);margin:18px auto 0;max-width:17ch;color:#fff}
.dr-mark{background:#FFD84D;color:#0A1530;padding:0 .14em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.dr-sub{font-size:clamp(16px,2cqi,20px);color:#D6DEF2;max-width:44ch;margin:18px auto 0;font-weight:500}
.dr-risks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:960px;margin:26px auto 0;text-align:left;list-style:none;padding:0}
.dr-risks li{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;gap:3px}
.dr-ri{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#FFB4A6;background:rgba(227,55,42,.22);border:1px solid rgba(255,140,120,.4);font-size:13px;margin-bottom:4px}
.dr-risks .t{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#FFD84D}
.dr-risks b{font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;line-height:1.25}
.dr-risks small{font-size:14px;color:#C9D3EC;line-height:1.45}
.dr-cta{display:inline-flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;background:linear-gradient(180deg,#1FCB78,#16B76A 55%,#0C8C4E);color:#fff;border-radius:14px;padding:16px 30px 14px;box-shadow:0 6px 0 #0A6F3E,0 20px 36px -18px rgba(12,140,78,.7);margin-top:28px;border:0;cursor:pointer;font-family:inherit}
.dr-cta.full{width:100%;margin-top:6px}
.dr-cta .big{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(17px,2.2cqi,22px);text-transform:uppercase;letter-spacing:.01em}
.dr-cta .small{font-size:13.5px;font-weight:600;color:#DFFBEA}
.dr-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:26px}
.dr-chips span{font-size:13.5px;font-weight:700;color:#E6ECF8;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);padding:7px 13px;border-radius:999px}
.dr-sec{padding:52px 20px;position:relative}
.dr-soft{background:#EEF4FF}
.dr-cream{background:#FFF8E4}
.dr-in{max-width:820px;margin:0 auto}
.dr-c{text-align:center}
.dr-sec h2{font-size:clamp(26px,4.6cqi,48px);margin:0;color:#0B1220}
.dr-hl{background:linear-gradient(180deg,transparent 56%,#FFD84D 56%,#FFD84D 92%,transparent 92%);padding:0 .08em}
.dr-ul{text-decoration:underline;text-decoration-color:#E3372A;text-decoration-thickness:4px;text-underline-offset:6px}
.dr-pains{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:28px 0 0;padding:0;list-style:none;text-align:left}
.dr-pains li{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:14px;background:#fff;border:2px solid #E3E8F2;font-weight:600;font-size:16px;line-height:1.45}
.dr-pains li.wide{grid-column:1/-1}
.dr-x{width:26px;height:26px;border-radius:50%;background:#FDECEA;color:#E3372A;display:grid;place-items:center;flex-shrink:0;font-weight:900;font-size:12px}
.dr-verdict{margin:28px 0 0;font-size:clamp(18px,2.4cqi,23px);font-weight:700}
.dr-tools{display:flex;flex-direction:column;gap:44px;margin-top:38px}
.dr-tool{position:relative;background:#fff;border:3px solid #0A1530;border-radius:20px;padding:26px 26px 24px 30px;box-shadow:8px 8px 0 #0A1530;text-align:left}
.dr-tool::before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:6px;border-radius:0 6px 6px 0;background:var(--acc)}
.dr-num{position:absolute;top:-15px;left:22px;background:#0A1530;color:#fff;font-family:'Archivo',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border-radius:7px}
.dr-stamp{position:absolute;top:-16px;right:22px;background:#FFD84D;color:#0A1530;font-family:'Archivo',sans-serif;font-weight:900;font-size:16px;letter-spacing:.04em;padding:7px 14px;border-radius:8px;transform:rotate(4deg);border:2px solid #0A1530}
.dr-tag{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#E3372A;background:#FDECEA;padding:5px 10px;border-radius:6px;margin-bottom:10px}
.dr-tool h3{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(22px,3cqi,30px);margin:0;color:#0B1220;letter-spacing:-.02em;line-height:1.08}
.dr-tool h3 small{display:block;font-family:'Figtree',sans-serif;font-weight:600;font-size:15px;color:#6B7690;margin-top:6px;letter-spacing:0}
.dr-tool p{color:#4B5568;margin:12px 0 0;font-size:16.5px}
.dr-tool p b{color:#0B1220}
.dr-ticks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-weight:700;font-size:14.5px}
.dr-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.dr-b1{display:inline-flex;align-items:center;font-family:'Archivo',sans-serif;font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.02em;background:#16B76A;color:#fff;padding:13px 20px;border-radius:12px;box-shadow:0 5px 0 #0A6F3E;text-decoration:none}
.dr-b2{display:inline-flex;align-items:center;font-weight:700;font-size:15px;color:#0A1530;padding:13px 20px;border-radius:12px;border:2px solid #0A1530;text-decoration:none;background:#fff}
.dr-vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:18px;margin-top:34px;text-align:left}
.dr-col{border-radius:20px;padding:24px}
.dr-col.bad{background:#fff;border:3px solid #E3372A}
.dr-col.good{background:#16B76A;color:#fff;border:3px solid #0C8C4E}
.dr-col h3{font-family:'Archivo',sans-serif;font-weight:900;font-size:20px;text-transform:uppercase;margin:0 0 14px}
.dr-col.bad h3{color:#E3372A}
.dr-row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-top:2px dashed rgba(11,18,32,.12);font-weight:600;font-size:15.5px}

<body>
<div id="root"><p style="padding:24px;font-family:system-ui">Loading the CRM…</p></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function () {
'use strict';
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

/* ═════════════════════════════ constants ═════════════════════════════ */
const STATUSES = ['New', 'Contacted', 'Engaged', 'Qualified', 'Converted', 'Disqualified', 'Unresponsive'];
const CLOSED = ['Converted', 'Disqualified', 'Unresponsive'];
const ROLES = ['Admin', 'Manager', 'Marketer', 'Sales rep', 'Viewer'];
const CHANNELS = [['email', 'Email'], ['sms', 'SMS'], ['call', 'Calls'], ['ai_voice_call', 'AI-voice calls']];
const FREE_DOMAINS = ['gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com', 'icloud.com', 'aol.com', 'live.com', 'msn.com', 'proton.me', 'protonmail.com'];
const DISPOSABLE = ['mailinator.com', 'tempmail.com', '10minutemail.com', 'guerrillamail.com', 'yopmail.com'];
const CALL_OUTCOMES = ['Connected', 'Voicemail', 'No answer', 'Wrong number', 'Call back', 'Not interested'];
const TRIGGERS = {
  lead_created_form: 'Lead created from a landing-page form',
  lead_created_any: 'Lead created from any source',
  microsite_signup_unverified: 'Microsite sign-up with email unverified',
  score_hot: 'Score moves into Hot',
  verified_no_action_3d: 'Verified, no key action for 3 days',
  ready_to_convert: 'Lead becomes Verified and Active',
  unresponsive_30d: 'Unresponsive for 30 days',
  manual: 'Manual enrolment only'
};
const EXITS = {
  reply: 'Lead replied', converted: 'Converted', unsubscribed: 'Email consent withdrawn', stop: 'SMS STOP', closed: 'Lead closed',
  call_logged: 'Any call outcome recorded', call_connected: 'Call connected', email_verified: 'Email verified', key_action: 'Key action completed', click: 'Clicked a link'
};
const STEP_TYPES = {
  email: 'Send email', sms: 'Send SMS', call: 'Place a call', notify_owner: 'Notify owner', notify_manager: 'Notify manager', wait: 'Wait'
};
const CALL_MODES = { rep: 'Speed-to-lead: ring the owner, then connect them to the lead', ai: 'AI voice agent calls the lead' };
const DEFAULT_SCORING = [
  { key: 'work_email', label: 'Work email domain (not a free mailbox)', points: 10 },
  { key: 'phone', label: 'Phone number provided and valid', points: 5 },
  { key: 'form', label: 'Form submitted (max 2 forms)', points: 10 },
  { key: 'click', label: 'Email clicked (max 5)', points: 3 },
  { key: 'reply', label: 'Replied to an email or SMS', points: 15 },
  { key: 'signup', label: 'Microsite sign-up', points: 15 },
  { key: 'verified', label: 'Verification passed', points: 10 },
  { key: 'active', label: 'Microsite active (rule met)', points: 20 },
  { key: 'unsub', label: 'Unsubscribed or bounced', points: -20 },
  { key: 'decay', label: 'No activity for 30 days', points: -10 }
];
const DEFAULT_SETTINGS = {
  orgName: 'Your company',
  team: [{ id: 'm-admin', name: 'Admin', role: 'Admin' }],
  scoring: DEFAULT_SCORING,
  bands: { warm: 20, hot: 50 },
  caps: { smsPerDay: 1, smsPerWeek: 3, emailPerDay: 2, callsPerDay: 2, callsTotal: 6 },
  quiet: { weekdayStart: 9, weekendStart: 10, end: 20 },
  cooldownDays: 30,
  clockOffsetMs: 0,
  rr: 0,
  suppression: [],
  images: [],
  views: [],
  customFields: [],
  assignRules: [],
  spend: {},
  templates: [
    { id: 'tpl-intro', name: 'Introduction', channel: 'email', subject: 'Following up, {{first_name}}', body: 'Hi {{first_name}},\n\nThanks for your interest. Would a 15-minute walkthrough this week help?\n\n{{owner}}, {{org}}' },
    { id: 'tpl-links', name: 'All tool links', channel: 'email', subject: 'Your free tools, {{first_name}}', body: 'Hi {{first_name}},\n\nAs promised, here are the links. Reply if you would like help getting started.\n\n{{owner}}' },
    { id: 'tpl-sms-check', name: 'Quick check-in', channel: 'sms', subject: '', body: 'Hi {{first_name}}, it’s {{owner}} from {{org}}. Any questions? Reply STOP to opt out.' }
  ],
  consentWording: {
    email: 'I agree to receive emails about these tools. I can unsubscribe at any time.',
    sms: 'I agree to receive text messages at this number. Message and data rates may apply. Reply STOP to opt out, HELP for help.',
    call: 'I agree to receive calls at this number about my enquiry.',
    ai_voice_call: 'I agree to receive automated or AI-voice calls at this number about my enquiry. Consent is not a condition of purchase.'
  }
};

/* ═════════════════════════════ small helpers ═════════════════════════════ */
const uid = (p) => (p || 'x') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = (o) => JSON.parse(JSON.stringify(o));
const DAY = 864e5, HOUR = 36e5;
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const lower = (s) => String(s || '').trim().toLowerCase();
const digits = (s) => String(s || '').replace(/\D/g, '');
const normPhone = (s) => { const d = digits(s); if (!d) return ''; if (d.length === 10) return '+1' + d; if (d.length === 11 && d[0] === '1') return '+' + d; return d.length >= 8 ? '+' + d : ''; };
const domainOf = (email) => lower(email).split('@')[1] || '';
const validEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || '').trim());
const fullName = (l) => [l.firstName, l.lastName].filter(Boolean).join(' ') || l.email || l.phone || 'Unnamed lead';
const fmtDate = (t) => t ? new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
const fmtDay = (t) => t ? new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const pct = (a, b) => b ? Math.round((a / b) * 1000) / 10 : 0;
const merge = (tpl, lead, s) => String(tpl || '')
  .replace(/{{\s*first_name\s*}}/g, lead.firstName || 'there')
  .replace(/{{\s*company\s*}}/g, lead.company || 'your practice')
  .replace(/{{\s*owner\s*}}/g, ownerName(s, lead.ownerId) || 'our team')
  .replace(/{{\s*org\s*}}/g, s.orgName || '');
function ownerName(s, id) { const m = (s.team || []).find((t) => t.id === id); return m ? m.name : ''; }

/* ═════════════════════════════ store ═════════════════════════════ */
const COLLS = ['leads', 'accounts', 'pages', 'automations', 'microsites'];
const S = { mode: 'connecting', leads: {}, accounts: {}, pages: {}, automations: {}, microsites: {}, settings: null, audit: [], ver: 0, readOnly: false };
const listeners = new Set();
let db = null, userCap = null, viewerId = null, assetsCap = null, downloadsCap = null, sampleCap = null;
const TAB = uid('tab');
function emit() { S.ver++; listeners.forEach((f) => f(S.ver)); }
function useStore() { const [, set] = useState(0); useEffect(() => { listeners.add(set); return () => listeners.delete(set); }, []); return S; }
const settings = () => S.settings || DEFAULT_SETTINGS;
const now = () => Date.now() + (settings().clockOffsetMs || 0);

/* one write at a time per document */
const queues = {};
function enqueue(path, fn) { const p = (queues[path] || Promise.resolve()).then(fn, fn); queues[path] = p.catch(() => {}); return p; }
function persistLocal() { try { localStorage.setItem('leadcrm-local', JSON.stringify({ leads: S.leads, accounts: S.accounts, pages: S.pages, automations: S.automations, microsites: S.microsites, settings: S.settings, audit: S.audit })); } catch (e) {} }
const toasts = { list: [], set: null };
function toast(msg, kind) { const t = { id: uid('t'), msg, kind }; toasts.list = [...toasts.list, t]; toasts.set && toasts.set(toasts.list); setTimeout(() => { toasts.list = toasts.list.filter((x) => x.id !== t.id); toasts.set && toasts.set(toasts.list); }, 4200); }

function cap(arr, n) { return arr.length > n ? arr.slice(arr.length - n) : arr; }
function shrinkLead(l) { l.timeline = cap(l.timeline || [], 400); l.messages = cap(l.messages || [], 200); l.calls = cap(l.calls || [], 100); l.tasks = cap(l.tasks || [], 150); l.runs = cap(l.runs || [], 60); return l; }

async function save(coll, id, data) {
  const body = coll === 'leads' ? shrinkLead(clone(data)) : clone(data);
  body.id = id; body.updatedAt = Date.now();
  if (coll === 'settings') S.settings = body; else S[coll] = { ...S[coll], [id]: body };
  emit();
  if (S.mode !== 'shared') { persistLocal(); return; }
  const path = coll === 'settings' ? 'settings/main' : coll + '/' + id;
  return enqueue(path, () => db.doc(path).set(body).catch((e) => writeError(e)));
}
async function remove(coll, id) {
  const next = { ...S[coll] }; delete next[id]; S[coll] = next; emit();
  if (S.mode !== 'shared') { persistLocal(); return; }
  return enqueue(coll + '/' + id, () => db.doc(coll + '/' + id).delete().catch((e) => writeError(e)));
}
function writeError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument' && !S.readOnly) { S.readOnly = true; emit(); toast('You have view-only access to this CRM, so changes are not saved.', 'bad'); }
  else if (code === 'quota_exceeded') toast('The CRM database is full. Delete sample or old leads to free space.', 'bad');
  else if (code === 'unavailable') toast('Connection hiccup — please try that again.', 'bad');
}
async function saveSettings(next) { return save('settings', 'main', next); }

function audit(action, detail) {
  const me = actingAs();
  const entry = { id: uid('a'), at: now(), real: Date.now(), who: me ? me.name + ' (' + me.role + ')' : 'Someone', viewer: viewerId || '', action, detail: detail || '' };
  S.audit = cap([...(S.audit || []), entry], 500); emit();
  if (S.mode !== 'shared') { persistLocal(); return; }
  enqueue('audit/log', () => db.doc('audit/log').set({ entries: S.audit }).catch(writeError));
}

/* acting-as: which team member this browser is using (per viewer, stored locally) */
function actingAs() {
  const team = settings().team || [];
  let id = null; try { id = localStorage.getItem('leadcrm-actor'); } catch (e) {}
  return team.find((t) => t.id === id) || team[0] || { id: 'm-admin', name: 'Admin', role: 'Admin' };
}
function setActor(id) { try { localStorage.setItem('leadcrm-actor', id); } catch (e) {} emit(); }

/* ═════════════════════════════ permissions (spec section C) ═════════════════════════════ */
function can(action, lead) {
  if (S.readOnly) return false;
  const me = actingAs(); const r = me.role;
  const own = lead ? (lead.ownerId === me.id || !lead.ownerId) : true;
  switch (action) {
    case 'view_all': return r !== 'Sales rep';
    case 'edit_lead': return ['Admin', 'Manager', 'Marketer'].includes(r) || (r === 'Sales rep' && own);
    case 'assign': return ['Admin', 'Manager'].includes(r);
    case 'delete': case 'export': return ['Admin', 'Manager'].includes(r);
    case 'convert': case 'verify': return ['Admin', 'Manager'].includes(r) || (r === 'Sales rep' && own);
    case 'send_email': return ['Admin', 'Manager', 'Marketer'].includes(r) || (r === 'Sales rep' && own);
    case 'send_sms': case 'call': return ['Admin', 'Manager'].includes(r) || (r === 'Sales rep' && own);
    case 'pages': return ['Admin', 'Manager', 'Marketer'].includes(r);
    case 'automations': return ['Admin', 'Manager', 'Marketer'].includes(r);
    case 'approve': return ['Admin', 'Manager'].includes(r);
    case 'scoring': return ['Admin', 'Manager'].includes(r);
    case 'admin': return r === 'Admin';
    case 'audit': return ['Admin', 'Manager'].includes(r);
    default: return false;
  }
}

/* ═════════════════════════════ scoring, verification, activity ═════════════════════════════ */
function micrositeOf(lead) { return lead.micrositeId ? S.microsites[lead.micrositeId] : null; }
const inMicrosite = (l, id) => (l.micrositeIds || (l.micrositeId ? [l.micrositeId] : [])).includes(id);
function verificationFor(lead) {
  const m = micrositeOf(lead);
  const req = (m && m.requiredChecks) || ['email', 'duplicate'];
  const v = lead.verification || {};
  const checks = req.map((k) => ({ key: k, result: (v[k] && v[k].result) || 'pending' }));
  const passed = checks.length > 0 && checks.every((c) => c.result === 'passed');
  const failed = checks.some((c) => c.result === 'failed');
  return { checks, passed, failed, status: passed ? 'Verified' : failed ? 'Failed' : 'Pending' };
}
function activeFor(lead, t) {
  const m = micrositeOf(lead); if (!m) return { active: false, days: 0, need: 0 };
  const need = (m.activeRule && m.activeRule.days) || 3, win = (m.activeRule && m.activeRule.windowDays) || 14;
  const since = (t || now()) - win * DAY;
  const days = new Set((lead.usage && lead.usage.keyActions || []).filter((x) => x >= since).map((x) => new Date(x).toISOString().slice(0, 10))).size;
  return { active: days >= need, days, need, win };
}
function lastActivity(lead) { const tl = lead.timeline || []; const ins = tl.filter((e) => e.actor !== 'system' || ['form_submit', 'microsite_event', 'inbound'].includes(e.type)); return ins.length ? ins[ins.length - 1].at : lead.createdAt; }
function scoreLead(lead, t) {
  const s = settings(); const pts = Object.fromEntries((s.scoring || DEFAULT_SCORING).map((r) => [r.key, Number(r.points) || 0]));
  const b = [];
  const add = (key, n, why) => { if (n) b.push({ key, points: n * (pts[key] || 0), why }); };
  const dom = domainOf(lead.email);

    </div>
    ${mode === 'board' ? html`<div class="board">${STATUSES.map((stt) => { const items = rows.filter((l) => l.status === stt);

function AddLead({ onClose, open }) {
  const s = settings();
  const [f, setF] = useState({ firstName: '', lastName: '', email: '', phone: '', company: '', title: '', source: 'Phone-in', timeZone: 'America/New_York' });
  const [consent, setConsent] = useState({ email: '', sms: '', call: '' });
  const dup = (f.email || f.phone) ? findDuplicate(f.email, f.phone) : null;
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const submit = async () => {
    if (!f.email && !f.phone) return toast('Add an email or a phone number.', 'bad');
    if (f.email && !validEmail(f.email)) return toast('That email address does not look right.', 'bad');
    const consents = {};
    Object.entries(consent).forEach(([ch, m]) => { if (m) consents[ch] = { method: m, wording: s.consentWording[ch], by: actingAs().name }; });
    const { lead, existing } = await upsertLead(f, { via: 'manual', source: { type: 'manual', name: f.source }, consents, ownerId: actingAs().id });
    toast(existing ? 'Matched an existing lead — details merged.' : 'Lead created.'); onClose(); open('lead', lead.id);
  };
  return html`<${Modal} title="Add lead" onClose=${onClose} foot=${html`<button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${submit}>Save lead</button>`}>
    <div class="grid g2"><${Field} label="First name"><input type="text" value=${f.firstName} onInput=${set('firstName')} /><//><${Field} label="Last name"><input type="text" value=${f.lastName} onInput=${set('lastName')} /><//>
      <${Field} label="Email"><input type="email" value=${f.email} onInput=${set('email')} /><//><${Field} label="Phone"><input type="tel" value=${f.phone} onInput=${set('phone')} /><//>
      <${Field} label="Company"><input type="text" value=${f.company} onInput=${set('company')} /><//><${Field} label="Source"><select value=${f.source} onChange=${set('source')}>${['Phone-in', 'Event', 'Referral', 'Walk-in', 'Other'].map((x) => html`<option key=${x}>${x}</option>`)}</select><//></div>
    ${dup ? html`<div class="banner">Possible duplicate: <b>${fullName(dup)}</b> (${dup.email || dup.phone}). Saving will merge into that lead. <button class="btn sm" onClick=${() => { onClose(); open('lead', dup.id); }}>Open it instead</button></div>` : null}
    <div><h3 style=${{ marginBottom: '6px' }}>Consent — record only what the person actually gave</h3>
      ${[['email', 'Email'], ['sms', 'SMS'], ['call', 'Calls']].map(([k, n]) => html`<div key=${k} class="check-row"><span>${n}</span><select style=${{ width: '220px' }} value=${consent[k]} onChange=${(e) => setConsent({ ...consent, [k]: e.target.value })}>
        <option value="">No consent</option><option value="written">Written (signed form, email)</option>${k !== 'sms' ? html`<option value="verbal">Verbal, on a call</option>` : null}</select></div>`)}
      <p class="hint">Verbal consent is not accepted for automated texts or AI-voice calls; those need written consent from a form.</p></div>
  <//>`;
}

function ImportCsv({ onClose }) {
  const [text, setText] = useState('first_name,last_name,email,phone,company\n');
  const [msId, setMsId] = useState(''); const [emailOk, setEmailOk] = useState(false);
  const [busy, setBusy] = useState(false);
  const parse = (t) => {
    const lines = t.trim().split(/\r?\n/).filter(Boolean); if (lines.length < 2) return [];
    const split = (line) => { const out = []; let cur = '', qd = false; for (let i = 0; i < line.length; i++) { const c = line[i]; if (c === '"') { if (qd && line[i + 1] === '"') { cur += '"'; i++; } else qd = !qd; } else if (c === ',' && !qd) { out.push(cur); cur = ''; } else cur += c; } out.push(cur); return out.map((x) => x.trim()); };
    const head = split(lines[0]).map((h) => lower(h).replace(/\s+/g, '_'));
    const map = { first_name: 'firstName', firstname: 'firstName', first: 'firstName', last_name: 'lastName', lastname: 'lastName', last: 'lastName', email: 'email', phone: 'phone', mobile: 'phone', company: 'company', practice: 'company', practice_name: 'company', title: 'title', npi: 'npi', practice_type: 'practiceType', priority: 'priority', name: 'name' };
    return lines.slice(1).map((ln) => { const v = split(ln); const o = {}; head.forEach((h, i) => { if (map[h]) o[map[h]] = v[i]; }); if (o.name && !o.firstName) { const p = o.name.trim().replace(/^dr\.?\s+/i, '').split(/\s+/); o.firstName = p[0]; o.lastName = p.slice(1).join(' '); } return o; }).filter((o) => o.email || o.phone);
  };
  const rows = parse(text);
  const go = async () => {
    setBusy(true); let made = 0, merged = 0;
    const m = S.microsites[msId];
    for (const r of rows) { const meta = m ? { via: 'microsite', micrositeId: m.id, micrositeName: m.name, source: { type: 'microsite', name: m.name }, tags: [m.name], consents: emailOk ? { email: { method: 'sign-up form (imported)', wording: settings().consentWording.email, source: m.name + ' export', by: 'lead' } } : {} } : { via: 'import', source: { type: 'import', name: 'CSV import' } }; const { existing } = await upsertLead(r, meta); existing ? merged++ : made++; }
    audit('CSV import', made + ' created, ' + merged + ' merged'); toast(made + ' leads created, ' + merged + ' merged into existing leads.'); setBusy(false); onClose();
  };
  return html`<${Modal} title="Import leads from CSV" onClose=${onClose} foot=${html`<button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" disabled=${!rows.length || busy} onClick=${go}>${busy ? 'Importing…' : 'Import ' + rows.length + ' rows'}</button>`}>
    <p class="small muted">Paste CSV with a header row. Recognised columns: name or first_name/last_name, email, phone, company or practice, title, npi, practice_type, priority — so a form-submissions export from your website host imports directly. Duplicates (same email or phone) are merged, not doubled. Imported leads have <b>no consent</b> — record it on each lead before messaging them.</p>
    <div class="grid g2"><${Field} label="These rows are sign-ups from" hint="Choose a microsite to give them its verification checklist and automations."><select value=${msId} onChange=${(e) => setMsId(e.target.value)}><option value="">Not a microsite (plain import)</option>${Object.values(S.microsites).map((m) => html`<option key=${m.id} value=${m.id}>${m.name}</option>`)}</select><//>
      ${msId ? html`<label class="row small" style=${{ alignSelf: 'end' }}><input type="checkbox" checked=${emailOk} onChange=${(e) => setEmailOk(e.target.checked)} /> The sign-up form asked for email consent and they ticked it</label>` : html`<span></span>`}</div>
    <textarea style=${{ minHeight: '200px', fontFamily: 'ui-monospace,monospace', fontSize: '12.5px' }} value=${text} onInput=${(e) => setText(e.target.value)} aria-label="CSV text"></textarea>
    <p class="small">${rows.length} valid row(s) found.</p>
  <//>`;
}

        <div class="row">

          <button class="btn" disabled=${!can('send_sms', lead)} onClick=${() => setModal('sms')}>SMS</button>
          <button class="btn" disabled=${!can('call', lead)} onClick=${() => setModal('call')}>Call</button>

  };

function ImagePicker({ value, onChange }) {

    if (!file) return; setBusy(true);
    try {
      let url, id;
      if (assetsCap) { const r = await assetsCap.upload(file); url = r.url; id = r.id; }
      else if (file.size < 1500000) { url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); }); id = uid('img'); }
      else { toast('Image too large for local mode (1.5 MB max).', 'bad'); setBusy(false); return; }
      const s = clone(settings()); s.images = [...(s.images || []), { id, url, name: file.name }]; await saveSettings(s); onChange(url); toast('Image added to the library.');
    } catch (e) { toast('Upload failed — only Editors can upload images.', 'bad'); }

function FieldEditor({ def, value, onChange }) {

  if (s.type === 'notify_manager') return 'Notify the manager' + (s.note ? ': “' + s.note + '”' : '');
  if (s.type === 'task') return 'Notify owner: “' + s.title + '” (older task step)';
  if (s.type === 'wait') return 'Wait ' + (s.hours >= 24 && s.hours % 24 === 0 ? s.hours / 24 + ' day(s)' : s.hours + ' hour(s)');

function RuleTest({ rule, onClose }) {
  const st = useStore(); const leads = Object.values(st.leads); const [pick, setPick] = useState(leads[0] ? leads[0].id : '');
  const lead = st.leads[pick];
  const sim = useMemo(() => {
    if (!lead) return [];
    const out = []; const cond = conditionsMet(lead, rule);
    out.push(cond ? 'Would not enrol: ' + cond : 'Would enrol (conditions met)');
    if (cond) return out;
    let t = 0;
    rule.steps.forEach((s, i) => {
      if (s.type === 'wait') { t += s.hours; out.push((i + 1) + '. Wait ' + s.hours + 'h (step runs at +' + t + 'h)'); return; }
      if (s.type === 'call') { let r = checkSend(lead, 'call', {}); if (!r && s.mode === 'ai' && !consentOk(lead, 'ai_voice_call')) r = 'no AI-voice call consent'; out.push((i + 1) + '. ' + stepSummary(s) + ' → ' + (r ? (r === 'quiet hours' ? 'held until contactable hours' : 'skipped: ' + r) : 'would call ' + lead.phone)); return; }
      if (s.type === 'email' || s.type === 'sms') { const r = checkSend(lead, s.type, { transactional: s.transactional, body: merge(s.body, lead, settings()) }); out.push((i + 1) + '. ' + stepSummary(s) + ' → ' + (r ? (r === 'quiet hours' ? 'held until contactable hours' : 'skipped: ' + r) : 'would send to ' + (s.type === 'email' ? lead.email : lead.phone))); return; }
      out.push((i + 1) + '. ' + stepSummary(s));
    });
    return out;
  }, [pick, rule, st.ver]);
  return html`<${Modal} title=${'Test run: ' + rule.name} onClose=${onClose} foot=${html`<button class="btn primary" onClick=${onClose}>Done</button>`}>
    <p class="small muted" style=${{ marginTop: 0 }}>Shows what would happen for one lead right now. Nothing is sent and nothing is saved.</p>
    <${Field} label="Sample lead"><select value=${pick} onChange=${(e) => setPick(e.target.value)}>${leads.map((l) => html`<option key=${l.id} value=${l.id}>${fullName(l)}</option>`)}</select><//>
    ${lead ? html`<ol class="steps">${sim.map((x, i) => html`<li key=${i}><span class="small">${x}</span></li>`)}</ol>` : html`<p class="muted">Add a lead first.</p>`}
  <//>`;
}

/* ═════════════════════════════ assignment rules ═════════════════════════════ */
const RULE_FIELDS = { practiceType: 'Practice type', priority: 'Wants help with', source: 'Source name', microsite: 'Microsite' };
function ruleOwner(fields, meta) {
  const rules = settings().assignRules || []; const team = settings().team || [];
  for (const r of rules) {
    if (!r.ownerId || !team.some((m) => m.id === r.ownerId)) continue;
    const v = r.field === 'practiceType' ? fields.practiceType : r.field === 'priority' ? fields.priority : r.field === 'source' ? (meta.source && meta.source.name) : r.field === 'microsite' ? meta.micrositeId : '';
    if (v && lower(v) === lower(r.value)) return r.ownerId;
  }
  return '';
}

/* ═════════════════════════════ AI assistant (Claude, via the sample capability) ═════════════════════════════ */
function leadBrief(lead) {
  const s = settings();
  const events = (lead.timeline || []).slice(-14).map((e) => fmtDate(e.at) + ': ' + e.summary).join('\n');
  const inbound = (lead.messages || []).filter((m) => m.direction === 'in').slice(-3).map((m) => '“' + m.body + '”').join(' ');
  return ['Organisation sending: ' + (s.orgName || ''),
    'Lead: ' + fullName(lead) + (lead.title ? ', ' + lead.title : '') + (lead.company ? ' at ' + lead.company : ''),
    'Practice type: ' + (lead.practiceType || 'unknown') + '. Wants help with: ' + (lead.priority || 'unknown') + '.',
    'Status: ' + lead.status + '. Score ' + (lead.score || 0) + ' (' + (lead.scoreBand || 'Cold') + '). Owner: ' + (ownerName(s, lead.ownerId) || 'unassigned') + '.',
    'Source: ' + ((lead.firstSource && lead.firstSource.name) || 'manual') + '. Microsite: ' + ((micrositeOf(lead) || {}).name || 'none') + '. Verification: ' + (lead.verificationStatus || 'n/a') + '.',
    'Consent: ' + (CHANNELS.filter(([k]) => consentOk(lead, k)).map(([, n]) => n).join(', ') || 'none') + '.',
    inbound ? 'Their recent replies: ' + inbound : 'They have not replied yet.',
    'Recent activity (oldest first):\n' + (events || 'none')].join('\n');
}
async function aiDraft(lead, ch, intent) {
  if (!sampleCap) throw new Error('unavailable');
  const rules = ch === 'sms'
    ? 'Write ONE SMS under 300 characters. Plain text. End with "Reply STOP to opt out."'
    : 'Write one short email: a subject line under 60 characters and a body of 60–140 words. Plain text, no markdown.';
  const prompt = 'You write follow-up messages for a small B2B healthcare-software sales team. Be warm, specific and brief. Never invent prices, discounts, statistics, legal claims or features not mentioned in the context. Never give medical or legal advice. Sign off with the owner\'s first name.\n\n'
    + rules + '\n\nGoal of this message: ' + (intent || 'a helpful next step based on where they are') + '\n\nContext:\n' + leadBrief(lead)
    + '\n\nReturn ONLY JSON: {"subject": "...", "body": "..."}' + (ch === 'sms' ? ' with subject as an empty string.' : '.');
  const out = await sampleCap.json(prompt, { modelTier: 'quick', cache: false });
  return { subject: String((out && out.subject) || ''), body: String((out && out.body) || '') };
}
async function aiSummary(lead) {
  if (!sampleCap) throw new Error('unavailable');
  const prompt = 'You are a sales assistant for a small B2B healthcare-software team. From the context below, write: (1) a 2-sentence summary of where this lead stands, (2) the single best next step, with who should do it and by when, and (3) one risk to watch. Use plain sentences, no markdown, under 110 words in total. Do not invent facts.\n\nContext:\n' + leadBrief(lead);
  const r = await sampleCap(prompt, { modelTier: 'quick', cache: false });
  return String(r && r.text || '').trim();
}
function AiSummaryCard({ lead, mut }) {
  const [busy, setBusy] = useState(false);
  if (!sampleCap) return null;
  const run = async () => { setBusy(true); try { const text = await aiSummary(lead); await mut((l) => { l.aiSummary = { text, at: now(), by: actingAs().name }; }); } catch (e) { toast(e && e.code === 'not_granted' ? 'AI access wasn’t granted.' : 'The AI assistant is unavailable right now.', 'bad'); } setBusy(false); };
  return html`<div class="card card-pad"><div class="row" style=${{ justifyContent: 'space-between', marginBottom: '6px' }}><h3>AI summary</h3><button class="btn sm" onClick=${run} disabled=${busy}>${busy ? 'Thinking…' : lead.aiSummary ? 'Refresh' : 'Summarise'}</button></div>
    ${lead.aiSummary ? html`<p class="small" style=${{ whiteSpace: 'pre-wrap', margin: 0 }}>${lead.aiSummary.text}</p><p class="hint" style=${{ marginTop: '6px' }}>${fmtDate(lead.aiSummary.at)} · ${lead.aiSummary.by} · AI-generated, check before acting</p>` : html`<p class="small muted" style=${{ margin: 0 }}>Claude reads this lead’s history and suggests the next step.</p>`}</div>`;
}

/* ═════════════════════════════ notifications ═════════════════════════════ */
function notificationsFor(me) {
  const t = now(); const out = [];
  Object.values(S.leads).forEach((l) => {
    const mine = l.ownerId === me.id || (!l.ownerId && can('view_all'));
    if (!mine) return;
    if (t - l.createdAt < DAY && l.status === 'New') out.push({ id: 'n-' + l.id, at: l.createdAt, kind: 'lead', text: 'New lead: ' + fullName(l), leadId: l.id });
    (l.messages || []).filter((m) => m.direction === 'in' && !m.handled).forEach((m) => out.push({ id: 'r-' + m.id, at: m.at, kind: 'reply', text: fullName(l) + ' replied by ' + m.channel, leadId: l.id }));
    if (l.callbackAt && l.callbackAt <= t + HOUR && !CLOSED.includes(l.status)) out.push({ id: 'cb-' + l.id, at: l.callbackAt, kind: 'task', text: 'Call back due: ' + fullName(l), leadId: l.id });
    (l.calls || []).filter((c) => c.status === 'pending').forEach((c) => out.push({ id: 'pc-' + c.id, at: c.at, kind: 'meeting', text: (c.mode === 'ai' ? 'AI call' : 'Automated call') + ' outcome to record: ' + fullName(l), leadId: l.id }));
    if (l.readyToConvert) out.push({ id: 'rc-' + l.id, at: l.updatedAt || t, kind: 'lead', text: 'Ready to convert: ' + fullName(l), leadId: l.id });
  });
  return out.sort((a, b) => b.at - a.at).slice(0, 40);
}
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const fmtTime = (t) => new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
function Bell({ open }) {
  useStore(); const [show, setShow] = useState(false);
  const items = notificationsFor(actingAs());
  const icon = { lead: '●', reply: '↩', task: '☎', meeting: '☎' };

    ${show ? html`<div class="bell-panel" role="dialog" aria-label="Notifications"><div class="row" style=${{ justifyContent: 'space-between', padding: '10px 12px', borderBottom: '1px solid var(--line-2)' }}><b>Notifications</b><button class="btn sm ghost" onClick=${() => setShow(false)} aria-label="Close">✕</button></div>
      ${items.length ? items.map((n) => html`<button key=${n.id} class="bell-item" onClick=${() => { setShow(false); open('lead', n.leadId); }}><span class=${'bell-ic k-' + n.kind}>${icon[n.kind]}</span><span><span>${n.text}</span><span class="small muted" style=${{ display: 'block' }}>${fmtDate(n.at)}</span></span></button>`) : html`<p class="small muted" style=${{ padding: '12px', margin: 0 }}>You’re all caught up.</p>`}</div>` : null}</div>`;
}

/* ═════════════════════════════ Inbox ═════════════════════════════ */
function InboxView({ open }) {
  const st = useStore(); const me = actingAs(); const s = settings();
  const [filter, setFilter] = useState('open'); const [mine, setMine] = useState(!can('view_all')); const [selId, setSelId] = useState(''); const [reply, setReply] = useState('');
  const items = Object.values(st.leads).filter((l) => !mine || l.ownerId === me.id || !l.ownerId)
    .flatMap((l) => (l.messages || []).filter((m) => m.direction === 'in' && (filter === 'all' || !m.handled)).map((m) => ({ ...m, lead: l }))).sort((a, b) => b.at - a.at);
  const sel = items.find((x) => x.id === selId) || items[0];
  const thread = sel ? (sel.lead.messages || []).filter((m) => m.channel === sel.channel).sort((a, b) => a.at - b.at) : [];
  const mark = async (m, handled) => { const l = clone(st.leads[m.lead.id]); const x = l.messages.find((y) => y.id === m.id); x.handled = handled; x.handledBy = actingAs().name; x.handledAt = now(); await save('leads', l.id, l); };
  const send = async () => {
    if (!sel || !reply.trim()) return; const l = clone(st.leads[sel.lead.id]);
    const r = sendMessage(l, sel.channel, { subject: sel.channel === 'email' ? 'Re: your message' : '', body: reply });
    if (r.ok) l.messages.forEach((x) => { if (x.direction === 'in' && x.channel === sel.channel && !x.handled) { x.handled = true; x.handledBy = actingAs().name; x.handledAt = now(); } });
    recompute(l); await save('leads', l.id, l); toast(r.ok ? 'Reply sent (simulated) and conversation marked handled.' : 'Not sent: ' + r.reason, r.ok ? '' : 'bad'); if (r.ok) setReply('');
  };
  const draft = async () => { try { const d = await aiDraft(sel.lead, sel.channel, 'reply helpfully to their latest message: “' + sel.body + '”'); setReply(d.body); } catch (e) { toast('The AI assistant is unavailable right now.', 'bad'); } };
  return html`<div><div class="page-head"><div><h1>Inbox</h1><p>Replies to your emails and texts, in one place. Answer here or open the lead.</p></div>
    <div class="row"><span class="seg"><button class=${filter === 'open' ? 'on' : ''} onClick=${() => setFilter('open')}>Needs reply</button><button class=${filter === 'all' ? 'on' : ''} onClick=${() => setFilter('all')}>All</button></span>${can('view_all') ? html`<label class="row small"><input type="checkbox" checked=${mine} onChange=${(e) => setMine(e.target.checked)} /> Only my leads</label>` : null}</div></div>
    ${items.length ? html`<div class="inbox"><div class="card inbox-list">${items.map((m) => html`<button key=${m.id} class=${'inbox-item' + (sel && sel.id === m.id ? ' on' : '')} onClick=${() => setSelId(m.id)}><span class="row" style=${{ justifyContent: 'space-between' }}><b class="small">${fullName(m.lead)}</b><span class="small muted">${fmtDate(m.at)}</span></span><span class="small muted">${m.channel.toUpperCase()} · ${ownerName(s, m.lead.ownerId) || 'Unassigned'}${m.handled ? ' · handled' : ''}</span><span class="small inbox-snip">${m.body}</span></button>`)}</div>
      ${sel ? html`<div class="card card-pad inbox-thread"><div class="row" style=${{ justifyContent: 'space-between', marginBottom: '10px' }}><div><h2>${fullName(sel.lead)}</h2><span class="small muted">${sel.channel === 'email' ? sel.lead.email : sel.lead.phone} · ${statusBadge(sel.lead.status)}</span></div><div class="row"><button class="btn sm" onClick=${() => open('lead', sel.lead.id)}>Open lead</button><button class="btn sm" onClick=${() => mark(sel, !sel.handled)}>${sel.handled ? 'Mark as needing reply' : 'Mark handled'}</button></div></div>
        <div class="thread">${thread.map((m) => html`<div key=${m.id} class=${'bubble ' + (m.direction === 'in' ? 'in' : 'out')}><div style=${{ whiteSpace: 'pre-wrap' }}>${m.subject && m.direction === 'out' ? html`<b>${m.subject}</b><br />` : null}${m.body}</div><span class="small muted">${fmtDate(m.at)}${m.direction === 'out' ? ' · ' + m.status : ''}</span></div>`)}</div>
        <div class="grid" style=${{ gap: '8px', marginTop: '12px' }}><textarea placeholder=${'Reply by ' + sel.channel + '…'} value=${reply} onInput=${(e) => setReply(e.target.value)} aria-label="Reply"></textarea>
          <div class="row" style=${{ justifyContent: 'space-between' }}>${sampleCap ? html`<button class="btn sm" onClick=${draft}>✦ Draft with AI</button>` : html`<span></span>`}<button class="btn primary" disabled=${!reply.trim() || !(sel.channel === 'sms' ? can('send_sms', sel.lead) : can('send_email', sel.lead))} onClick=${send}>Send reply</button></div></div></div>` : null}</div>`
    : html`<div class="card"><div class="empty"><h2>${filter === 'open' ? 'Nothing needs a reply' : 'No replies yet'}</h2><p>When a lead replies to an email or text, it lands here. In this demo, use “Reply” on a sent message to simulate one.</p></div></div>`}</div>`;
}

/* ═════════════════════════════ Merge duplicates ═════════════════════════════ */
function MergeModal({ lead, onClose, open }) {
  const st = useStore(); const [q, setQ] = useState(''); const [otherId, setOtherId] = useState('');
  const dom = domainOf(lead.email);
  const suggestions = Object.values(st.leads).filter((l) => l.id !== lead.id && ((lead.lastName && lower(l.lastName) === lower(lead.lastName) && lower(l.firstName) === lower(lead.firstName)) || (dom && !FREE_DOMAINS.includes(dom) && domainOf(l.email) === dom) || (lead.company && lower(l.company) === lower(lead.company))));
  const matches = q ? Object.values(st.leads).filter((l) => l.id !== lead.id && lower(fullName(l) + ' ' + (l.email || '') + ' ' + (l.phone || '') + ' ' + (l.company || '')).includes(lower(q))).slice(0, 8) : suggestions.slice(0, 8);
  const other = st.leads[otherId];
  const go = async () => {
    if (!other) return;
    if (other.accountId && lead.accountId && other.accountId !== lead.accountId) return toast('These leads belong to different accounts. Merge the accounts first.', 'bad');
    const a = clone(lead), b = clone(other);
    ['firstName', 'lastName', 'email', 'phone', 'company', 'title', 'npi', 'practiceType', 'priority', 'micrositeId', 'accountId'].forEach((k) => { if (!a[k] && b[k]) a[k] = b[k]; });
    a.custom = { ...(b.custom || {}), ...(a.custom || {}) };
    a.tags = Array.from(new Set([...(a.tags || []), ...(b.tags || [])]));
    ['timeline', 'messages', 'calls', 'tasks', 'meetings'].forEach((k) => { a[k] = [...(a[k] || []), ...(b[k] || [])].sort((x, y) => (x.at || x.createdAt || 0) - (y.at || y.createdAt || 0)); });
    (b.runs || []).forEach((r) => { if (r.state === 'active') { r.state = 'exited'; r.exitReason = 'merged into another lead'; r.endedAt = now(); } });
    a.runs = [...(a.runs || []), ...(b.runs || [])];
    const cons = { ...(a.consents || {}) }; Object.entries(b.consents || {}).forEach(([ch, c]) => { if (!cons[ch] || (c.at || 0) > (cons[ch].at || 0)) cons[ch] = c; }); a.consents = cons;
    const ver = { ...(a.verification || {}) }; Object.entries(b.verification || {}).forEach(([k, v]) => { if (!ver[k] || (v.result === 'passed' && ver[k].result !== 'passed')) ver[k] = v; }); a.verification = ver;
    a.usage = { keyActions: [...((a.usage && a.usage.keyActions) || []), ...((b.usage && b.usage.keyActions) || [])].sort() };
    if ((b.createdAt || 0) < (a.createdAt || 0)) { a.createdAt = b.createdAt; a.firstSource = b.firstSource || a.firstSource; }
    tl(a, 'merge', 'Merged with duplicate ' + fullName(b) + ' (' + (b.email || b.phone || b.id) + ')');
    recompute(a); await save('leads', a.id, a);
    if (b.accountId && st.accounts[b.accountId]) { const acct = clone(st.accounts[b.accountId]); acct.leadIds = Array.from(new Set((acct.leadIds || []).map((x) => x === b.id ? a.id : x))); if (acct.primaryLeadId === b.id) acct.primaryLeadId = a.id; await save('accounts', acct.id, acct); }
    await remove('leads', b.id); audit('Leads merged', fullName(b) + ' → ' + fullName(a)); toast('Merged. One lead, one timeline.'); onClose();
  };
  return html`<${Modal} title=${'Merge a duplicate into ' + fullName(lead)} onClose=${onClose} foot=${html`<button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" disabled=${!other} onClick=${go}>Merge</button>`}>
    <p class="small muted" style=${{ marginTop: 0 }}>The other lead’s history, messages and calls move into this one; empty fields are filled in; the newest consent per channel wins. The other record is then deleted.</p>
    <input type="search" placeholder="Search for the duplicate" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="Search leads" />
    ${!q && suggestions.length ? html`<span class="small muted">Possible duplicates (same name, company or work domain):</span>` : null}
    <div class="grid" style=${{ gap: '6px' }}>${matches.map((l) => html`<label key=${l.id} class=${'tpl' + (otherId === l.id ? ' on' : '')} style=${{ padding: '10px', flexDirection: 'row', alignItems: 'center', gap: '10px' }}><input type="radio" name="dup" checked=${otherId === l.id} onChange=${() => setOtherId(l.id)} /><span><b>${fullName(l)}</b><span class="small muted" style=${{ display: 'block' }}>${[l.company, l.email, l.phone].filter(Boolean).join(' · ')} · ${l.status}</span></span></label>`)}</div>
    ${!matches.length ? html`<p class="small muted">${q ? 'No leads match.' : 'No likely duplicates found. Search above.'}</p>` : null}<//>`;
}

/* ═════════════════════════════ Settings: custom fields, assignment rules, backup ═════════════════════════════ */
function CustomFieldsEditor({ s, upd, admin }) {

  const set = (i, patch) => { const n = [...list]; n[i] = { ...n[i], ...patch }; upd({ customFields: n }); };
  return html`<div class="card card-pad"><h2 style=${{ marginBottom: '10px' }}>Custom lead fields</h2><p class="small muted" style=${{ marginTop: 0 }}>Extra fields on every lead’s Details tab, included in CSV downloads.</p>
    <fieldset disabled=${!admin} style=${{ border: 0, padding: 0, margin: 0, display: 'grid', gap: '8px' }}>
    ${list.map((f, i) => html`<div key=${f.key} class="list-item"><div class="row"><input type="text" style=${{ flex: 1 }} value=${f.label} onInput=${(e) => set(i, { label: e.target.value })} aria-label="Field label" /><select style=${{ width: '120px' }} value=${f.type} onChange=${(e) => set(i, { type: e.target.value })} aria-label="Field type"><option value="text">Text</option><option value="number">Number</option><option value="date">Date</option><option value="select">Choice</option></select><button class="btn sm danger" onClick=${() => upd({ customFields: list.filter((x) => x.key !== f.key) })} aria-label="Remove field">✕</button></div>
      ${f.type === 'select' ? html`<input type="text" placeholder="Choices, separated by commas" value=${(f.options || []).join(', ')} onInput=${(e) => set(i, { options: e.target.value.split(',').map((x) => x.trim()).filter(Boolean) })} aria-label="Choices" />` : null}</div>`)}
    <button class="btn sm" style=${{ justifySelf: 'start' }} onClick=${() => upd({ customFields: [...list, { key: uid('cf'), label: 'New field', type: 'text', options: [] }] })}>+ Add field</button></fieldset></div>`;
}
function AssignRulesEditor({ s, upd, admin }) {
  const rules = s.assignRules || [];
  const set = (i, patch) => { const n = [...rules]; n[i] = { ...n[i], ...patch }; upd({ assignRules: n }); };
  const valuesFor = (field) => field === 'practiceType' ? FIELD_DEFS.practiceType.options : field === 'priority' ? FIELD_DEFS.priority.options : field === 'microsite' ? Object.values(S.microsites).map((m) => m.id) : null;
  return html`<div class="card card-pad"><h2 style=${{ marginBottom: '10px' }}>Assignment rules</h2><p class="small muted" style=${{ marginTop: 0 }}>Checked top to bottom for every new lead; the first match sets the owner. No match → round-robin between Sales reps.</p>
    <fieldset disabled=${!admin} style=${{ border: 0, padding: 0, margin: 0, display: 'grid', gap: '8px' }}>
    ${rules.map((r, i) => { const vals = valuesFor(r.field); return html`<div key=${r.id} class="row list-item" style=${{ display: 'flex' }}><span class="small">If</span>
      <select style=${{ width: 'auto' }} value=${r.field} onChange=${(e) => set(i, { field: e.target.value, value: '' })} aria-label="Field">${Object.entries(RULE_FIELDS).map(([k, n]) => html`<option key=${k} value=${k}>${n}</option>`)}</select><span class="small">is</span>
      ${vals ? html`<select style=${{ width: 'auto', flex: 1 }} value=${r.value} onChange=${(e) => set(i, { value: e.target.value })} aria-label="Value"><option value="">Choose…</option>${vals.map((v) => html`<option key=${v} value=${v}>${r.field === 'microsite' ? (S.microsites[v] || {}).name : v}</option>`)}</select>` : html`<input type="text" style=${{ flex: 1 }} value=${r.value} onInput=${(e) => set(i, { value: e.target.value })} aria-label="Value" />`}
      <span class="small">→</span><select style=${{ width: 'auto' }} value=${r.ownerId} onChange=${(e) => set(i, { ownerId: e.target.value })} aria-label="Assign to"><option value="">Choose owner…</option>${(s.team || []).map((m) => html`<option key=${m.id} value=${m.id}>${m.name}</option>`)}</select>
      <button class="btn sm danger" onClick=${() => upd({ assignRules: rules.filter((x) => x.id !== r.id) })} aria-label="Remove rule">✕</button></div>`; })}
    <button class="btn sm" style=${{ justifySelf: 'start' }} onClick=${() => upd({ assignRules: [...rules, { id: uid('ar'), field: 'practiceType', value: '', ownerId: '' }] })}>+ Add rule</button></fieldset></div>`;
}
async function downloadBackup() {
  const data = { exportedAt: new Date().toISOString(), org: settings().orgName, settings: S.settings, leads: S.leads, accounts: S.accounts, pages: S.pages, automations: S.automations, microsites: S.microsites, audit: S.audit };
  const ok = await downloadText('lead-crm-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(data, null, 1));
  if (ok) audit('Full backup downloaded', Object.keys(S.leads).length + ' leads');
}
